[tool.uv.workspace]
members = [
    "packages/core",
    "packages/db",
    "packages/llm",
    "packages/sandbox",
    "packages/observability",
    "packages/retrieval",
    "packages/evals",
    "packages/testing",
    "apps/api",
    "apps/cli",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
markers = [
    "integration: tests that require a real database or Supabase project",
    "e2e: end-to-end tests",
    "live_llm: tests that hit a real LLM provider (needs API keys in env)",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "polyfactory>=2.18",
    "types-PyYAML>=6.0",
]