[project]
name = "vera-observability"
version = "0.1.0"
description = "VERA observability"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_obs"]

[tool.uv.sources]
vera-core = { workspace = true }
