[project]
name = "vera-evals"
version = "0.1.0"
description = "VERA evals"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "vera-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_evals"]

[tool.uv.sources]
vera-core = { workspace = true }
vera-testing = { workspace = true }
