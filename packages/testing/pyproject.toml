[project]
name = "vera-testing"
version = "0.1.0"
description = "VERA shared test utilities"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "polyfactory>=2.18",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_testing"]

[tool.uv.sources]
vera-core = { workspace = true }
