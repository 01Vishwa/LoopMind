[project]
name = "vera-retrieval"
version = "0.1.0"
description = "VERA retrieval"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "pgvector>=0.3",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_retrieval"]

[tool.uv.sources]
vera-core = { workspace = true }
