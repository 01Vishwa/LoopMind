[project]
name = "vera-core"
version = "0.1.0"
description = "VERA core domain models, ports, policies, and orchestration loop"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "jinja2>=3.1",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real database",
    "e2e: end-to-end tests",
]
