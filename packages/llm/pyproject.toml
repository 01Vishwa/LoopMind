[project]
name = "vera-llm"
version = "0.1.0"
description = "VERA LLM gateway"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tenacity>=9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real database",
    "e2e: end-to-end tests",
    "live_llm: tests that hit a real LLM provider (needs API keys in env)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_llm"]

[tool.uv.sources]
vera-core = { workspace = true }
