[project]
name = "vera-llm"
version = "0.1.0"
description = "VERA LLM gateway"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_llm"]

[tool.uv.sources]
vera-core = { workspace = true }
