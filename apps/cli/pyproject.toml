[project]
name = "vera-cli"
version = "0.1.0"
description = "VERA command-line interface"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "vera-db",
    "vera-llm",
    "vera-testing",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[project.scripts]
vera = "vera_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real database",
    "e2e: end-to-end tests",
    "live_llm: tests that hit a real LLM provider (needs API keys in env)",
]

[tool.uv.sources]
vera-core = { workspace = true }
vera-db = { workspace = true }
vera-llm = { workspace = true }
vera-testing = { workspace = true }
