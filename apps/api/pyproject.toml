[project]
name = "vera-api"
version = "0.1.0"
description = "VERA FastAPI application"
requires-python = ">=3.13"
dependencies = [
    "vera-core",
    "vera-testing",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=43.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real database",
    "e2e: end-to-end tests",
]

[tool.uv.sources]
vera-core = { workspace = true }
vera-testing = { workspace = true }
