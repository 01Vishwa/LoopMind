[mypy]
python_version = 3.13
strict = True
warn_return_any = True
warn_unused_configs = True
plugins = pydantic.mypy

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True
